<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Roster Manager</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f6f9;
        padding:30px;
    }

    .container{
        max-width:800px;
        margin:auto;
        background:white;
        padding:25px;
        border-radius:12px;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    h1{
        text-align:center;
        color:#2c3e50;
        margin-bottom:20px;
    }

    .form{
        display:grid;
        grid-template-columns:2fr 1fr auto;
        gap:10px;
        margin-bottom:20px;
    }

    input{
        padding:12px;
        border:1px solid #ccc;
        border-radius:6px;
    }

    button{
        padding:12px 20px;
        background:#3498db;
        color:white;
        border:none;
        border-radius:6px;
        cursor:pointer;
    }

    button:hover{
        background:#2980b9;
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    th, td{
        border:1px solid #ddd;
        padding:12px;
        text-align:center;
    }

    th{
        background:#3498db;
        color:white;
    }

    tr:nth-child(even){
        background:#f8f9fa;
    }

    .serial{
        font-weight:bold;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Student Roster System</h1>

    <div class="form">
        <input type="text" id="studentName" placeholder="Student Name">
        <input type="number" id="refNumber" placeholder="Reference No">
        <button onclick="addStudent()">Add</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Roster Position</th>
                <th>Reference Number</th>
                <th>Student Name</th>
            </tr>
        </thead>
        <tbody id="rosterTable">
        </tbody>
    </table>
</div>

<script>
    let students = [];

    function addStudent() {
        const name = document.getElementById("studentName").value.trim();
        const ref = document.getElementById("refNumber").value;

        if (!name || !ref) {
            alert("Please enter both fields.");
            return;
        }

        students.push({
            name: name,
            refNumber: Number(ref)
        });

        students.sort((a, b) => a.refNumber - b.refNumber);

        renderRoster();

        document.getElementById("studentName").value = "";
        document.getElementById("refNumber").value = "";
    }

    function renderRoster() {
        const table = document.getElementById("rosterTable");
        table.innerHTML = "";

        students.forEach((student, index) => {
            table.innerHTML += `
                <tr>
                    <td class="serial">${index + 1}</td>
                    <td>${student.refNumber}</td>
                    <td>${student.name}</td>
                </tr>
            `;
        });
    }
</script>

</script>
</body>
</html>
